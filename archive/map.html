ion can also be used as an early diagnostic indicator of whether digital workplace conditions are enabling employee adjustment and career adaptability. Originality/value This study advances theory by conceptualising the digital workplace as an integrated socio-technical system shaping employees' career adaptability through people-related processes. By integrating SDT and CCT, it identifies job satisfaction as a key psychological mechanism linking digital workplace conditions to career adaptability. Empirical evidence from Vietnam's technology sector further extends existing knowledge beyond Western contexts and highlights the critical role of motivationally supportive digital work environments in developing employee adaptability relevant to organisational effectiveness.",

    "abstract": "Abstract Guided by Psychology of Working Theory (PWT), the current study examined the longitudinal relations between parental economic resources, decent education, and decent work attainment using a nationally representative sample of 7683 participants from the National Longitudinal Study of Adolescent to Adult Health (Add Health). Key constructs were operationalized using available indicators in the Add Health dataset, serving as close approximations of core PWT constructs. Multigroup structural equation modeling explored variations across racial and sex groups. Results indicated significant yet modest associations between economic resources, decent education, and decent work over time, with decent education serving as a partial indirect link between early economic resources and later work outcomes. Post hoc analyses indicated that individual components of decent education related to decent work primarily among non‐Hispanic White participants, with inconsistent associations in the other racial groups. These findings highlight how educational experiences may contribute to work attainment and point to the potential utility of an extended PWT framework for understanding education‐to‐work transitions. By combining a longitudinal design with nationally representative data and multigroup modeling, this study provides an empirical foundation for future research and applied efforts to promote equitable access to decent work across diverse populations.",

    "abstract": "ABSTRACT For many early‐career academics (ECAs), unstable and short‐term contracts are a major contributor to employment precarity. However, even when job security improves, feelings of professional and personal insecurity often persist. This study uses psychological precarity as an analytical lens to examine how such insecurity is experienced and internalised, shaped not only by employment conditions but also by institutional culture, role ambiguity, and the search for professional legitimacy. A reflexive thematic analysis of longitudinal focus group data with 12 early career researchers over a 12‐month period in a higher education institution was conducted. Five themes were identified: (1) the persistence of psychological precarity beyond job security; (2) systemic drivers of precarity; (3) navigating the boundaries of an ill‐defined role and workload; (4) relational supports and complexities; and (5) the search for work‐related value and meaning. Rather than identifying new forms of insecurity, the findings demonstrate how employment insecurity, organisational ambiguity, identity, and relational dynamics interact to produce enduring experiences of psychological precarity. The study highlights the value of psychological precarity as an analytical lens for understanding early academic careers and offers institutional recommendations to reduce psychological burden, particularly within international higher education contexts.",

    "abstract": "Rapid technological changes and evolving labor market demands have increased the importance of identifying the competencies required for successful workforce participation. This study examines how digital competencies (DC) contribute to job market readiness (JMR) among university students and recent graduates in Saudi Arabia by investigating the mediating role of employability competencies (EC) and the moderating role of labor market dynamism (LMD). Drawing on Human Capital Theory and Career Construction Theory, the study develops an integrated framework explaining how individual competencies and labor market conditions jointly shape workforce preparedness. Data were collected using a stratified random sampling approach from 400 participants (248 final-year university students and 152 recent graduates) recruited from universities in Riyadh, Jeddah, Dammam, Medina, and Yanbu using a structured questionnaire. The hypotheses were tested using regression analysis and Hayes’ PROCESS macro, while confirmatory factor analysis was conducted using AMOS 27. The results indicate that DC positively influences both EC and JMR. EC also positively affected JMR and partially mediated the relationship between DC and JMR. Furthermore, LMD significantly strengthened the positive effect of DC on JMR, suggesting that digital competencies are becoming increasingly valuable in dynamic employment environments. This study contributes to the workforce preparedness literature by providing a more comprehensive explanation of how digital competencies are associated with job market readiness through employability competencies and identifying labor market dynamism as a contextual condition associated with the strength of this relationship. The findings offer implications for universities, policymakers, and students seeking to enhance employability outcomes and align workforce development initiatives with Saudi Arabia’s Vision 2030.",

    "abstract": "<title>Abstract</title> Purpose. The growing adoption of AI is reshaping organizational workflows and employee experiences, delivering benefits while presenting novel challenges, reflecting a double-edged sword effect. Although prior studies have identified potential impacts of AI usage on employees, the underlying mechanisms remain insufficiently examined. Guided by self-determination theory, this study investigates the dual pathways—facilitative and inhibitive—by which AI usage impacts employee task performance via motivational and behavioral mechanisms. It further investigates the boundary role of core self-evaluations (CSE) in moderating these effects. Methodology. A three-wave, multi-source field study was conducted involving 409 employee-supervisor pairs from AI-intensive industries in China. Data were collected using leader–employee matched questionnaires. Key constructs—AI usage, motivation types, job crafting, task performance, and CSE—were measured using validated scales. Hypotheses were tested via hierarchical regression, bootstrapping, and moderated mediation analyses using SPSS and Mplus. Findings. Results revealed a dual-chain mediation mechanism: AI usage enhances task performance via autonomous motivation and promotion-focused job crafting, but simultaneously impairs it through controlled motivation and prevention-focused job crafting. Furthermore, CSE significantly moderates both pathways, amplifying the positive and buffering the negative effects. Originality. This study provides understanding of AI usage’s “double-edged sword” effect by identifying parallel motivational-behavioral pathways and the boundary condition of core self-evaluations. The findings enrich self-determination theory in the digital context and offer actionable insights for designing inclusive and personalized AI integration strategies.",

    "abstract": "Purpose This article pursues three goals: to clarify the conceptual distinction between ontological, functional, and instrumental modeling claims about mental unity and multiplicity; to situate parts-based psychotherapy within contemporary network neuroscience rather than against an outdated unity-versus-multiplicity binary; and to propose an internal family systems (IFS)-informed artificial intelligence (AI) system design for therapist training and psychoeducational support.Materials and methods Conceptual and narrative review drawing on philosophy of mind, contemporary network neuroscience, experimental psychology, and clinical psychotherapy literature. Philosophical positions from Descartes through contemporary analytic and phenomenological accounts are evaluated, followed by systematic review of network neuroscience findings on integration-segregation dynamics, split-brain and dissociation research, and experimental psychology evidence on pluralistic self-modeling. IFS is compared against alternative parts-based frameworks on criteria of structural specificity, relational articulation, and computational tractability.Results The unity-multiplicity binary is shown to be unproductive for both philosophy and neuroscience. Contemporary network neuroscience characterizes cognition as emerging from flexible integration-segregation dynamics among distributed brain networks, framing functional multiplicity as the normal operating condition of mind rather than an anomaly. Among available parts-based frameworks, IFS is identified as the most tractable instrumental modeling template, distinguished by its discrete role taxonomy, formally specifiable interaction dynamics including polarization, blending, and burden-carrying, and its coordinative principle of self-leadership. A three-layer computational design is proposed: a parts layer implementing semi-autonomous dialogue agents with defined activation conditions and behavioral constraints; a self-like integrative layer enforcing coordinative and ethical constraints via constitutional principles; and a safety layer providing crisis detection, boundary maintenance, and prohibition of deep trauma processing. Two target applications are specified and distinguished: structured simulation for therapist training and psychoeducational self-reflection support.Conclusions The mind is best understood as functional multiplicity with emergent, relational unity, in which coordination rather than structure is the source of psychological coherence. IFS provides a structurally clear and relationally articulate template for AI-supported therapist training and psychoeducational tools. The proposed system design is conceptual rather than implemented, and all reported performance illustrations were generated under controlled mock conditions rather than with production language models. Empirical validation, continued growth of the IFS evidence base, and interdisciplinary collaboration among clinicians, philosophers, AI researchers, and ethicists are required before any deployment.",

    "abstract": "As artificial intelligence is increasingly embedded into education and career development contexts and its applications grow in higher education, how student acceptance of artificial intelligence affects student perception of employability is a major research topic. Based on SCCT, we see generative AI acceptance (GAIA) as a situational occupational resource and study how it affects students' perceived employability (SPE) through positive AI attitude (PAAI) and career adaptability (CA). We used PLS-SEM to model 689 Chinese students. We found that acceptance of artificial intelligence was positively associated with positive attitudes toward artificial intelligence, which in turn promote career adaptability, and subsequently with students' perceived employability. Acceptance of artificial intelligence also indirectly affects perceived employability through successive positive attitudes toward artificial intelligence and career adaptability. This paper further strengthens the theoretical impact of SCCT on digital technology. The findings indicate that acceptance of artificial intelligence was positively associated with perceived employability, both directly and indirectly through positive attitudes toward artificial intelligence and career adaptability. Practically, it emphasizes that universities must develop vocational adaptability resources of students, beyond just technological applications, to support students' readiness to work in AI-driven jobs.",

    "abstract": "ABSTRACT Psychology of Working Theory (PWT) posits that work volition, a person's perceived freedom of work choice despite barriers, allows people to access decent work. As this relationship has received considerable research attention in the last decade, we conducted a meta‐analysis for synthesizing the accumulated evidence to this theoretically proposed relationship. We meta‐analyzed the findings of 43 effect sizes ( N = 18,659) across 42 unique publications. A positive and large summary effect size ( r = 0.48, p &lt; 0.001) showed that work volition was strongly related to decent work. While there is considerable heterogeneity across the results, the strength of this relationship was not moderated by the proposed variables (e.g., cultural dimensions) in this study. Overall, we presented empirical evidence supporting the theoretical association between work volition and decent work postulated by PWT. By identifying a critical error in the current meta‐analysis literature—namely, the practice of treating manifest and latent correlations as equivalent effect sizes—this research also makes a substantial contribution to improving future meta‐analyses within the PWT.",

        event.subject.fy = event.subject.y;
      }
      function dragged(event) {
        event.subject.fx = event.x;
        event.subject.fy = event.y;
      }
      function dragended(event) {
        if (!event.active) sim.alphaTarget(0);
        event.subject.fx = null;
        event.subject.fy = null;
      }
      return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
    }

    // 4. Label Mode Toggle (Hover Only vs Always Show)
    const btnToggleLabels = document.getElementById("btnToggleLabels");

    btnToggleLabels.onclick = () => {
      alwaysShowLabels = !alwaysShowLabels;
      if (alwaysShowLabels) {
        btnToggleLabels.classList.add("active");
        btnToggleLabels.textContent = "🏷️ 라벨: 항상 표시 중";
        labels.style("opacity", 1);
      } else {
        btnToggleLabels.classList.remove("active");
        btnToggleLabels.textContent = "🏷️ 라벨: 호버 시 표시";
        updateLabelVisibilityOnZoom(currentZoom);
      }
    };

    // 5. Rich Korean Hover Highlighting
    const tooltip = document.getElementById("graphTooltip");

    node.on("mouseenter", (event, d) => {
      // Find connected nodes
      const connectedNodeIds = new Set();
      connectedNodeIds.add(d.id);

      links.forEach(l => {
        if (l.source.id === d.id) connectedNodeIds.add(l.target.id);
        if (l.target.id === d.id) connectedNodeIds.add(l.source.id);
      });

      // Dim non-connected
      node.style("opacity", n => connectedNodeIds.has(n.id) ? 1 : 0.08);

      // Light up connected links with laser glow
      link
        .attr("stroke", l => (l.source.id === d.id || l.target.id === d.id) ? "var(--line-highlight)" : "var(--line-color)")
        .attr("stroke-width", l => (l.source.id === d.id || l.target.id === d.id) ? 2.5 : 0.9)
        .attr("stroke-opacity", l => (l.source.id === d.id || l.target.id === d.id) ? 1 : 0.03);

      // Reveal labels of connected nodes
      labels.style("opacity", n => {
        if (connectedNodeIds.has(n.id)) return 1;
        if (alwaysShowLabels) return 0.2;
        return n.type === 'paper' ? 0 : 0.15;
      });

      // Show Rich Tooltip
      tooltip.style.display = "block";
      if (d.type === 'paper') {
        const p = d.data;
        tooltip.innerHTML = `
          <div class="tooltip-header">
            <span class="tooltip-badge">${p.queryLabel}</span>
            <span class="tooltip-venue">${escapeHtml(p.venue)} · ${escapeHtml(p.pubDate)}</span>
          </div>
          <div class="tooltip-title">${escapeHtml(p.title)}</div>
          ${p.aiFindings ? `
            <div class="tooltip-findings">
              <strong>💡 주요 결과:</strong> ${escapeHtml(p.aiFindings)}
            </div>
          ` : ''}
          ${p.aiImplications ? `
            <div class="tooltip-implications">
              <strong>🧭 상담 시사점:</strong> ${escapeHtml(p.aiImplications)}
            </div>
          ` : ''}
          <div class="tooltip-hint">클릭하여 전체 브리프 열람 ↗</div>
        `;
      } else {
        const count = links.filter(l => l.source.id === d.id || l.target.id === d.id).length;
        tooltip.innerHTML = `
          <div class="tooltip-title" style="margin-bottom:4px;">${d.type === 'category' ? '📁 ' : '#'}${escapeHtml(d.label)}</div>
          <div style="font-size:0.78rem; color:var(--text-muted);">연결된 연구 논문: <strong>${count}편</strong></div>
        `;
      }

      positionTooltip(event);
    })
    .on("mousemove", (event) => {
      positionTooltip(event);
    })
    .on("mouseleave", () => {
      node.style("opacity", 1);
      link
        .attr("stroke", "var(--line-color)")
        .attr("stroke-width", 0.9)
        .attr("stroke-opacity", 0.5);
      updateLabelVisibilityOnZoom(currentZoom);
      tooltip.style.display = "none";
    });

    function positionTooltip(event) {
      const padding = 16;
      let x = event.clientX + padding;
      let y = event.clientY + padding;
      if (x + 390 > window.innerWidth) x = event.clientX - 390;
      if (y + 220 > window.innerHeight) y = event.clientY - 200;
      tooltip.style.left = x + "px";
      tooltip.style.top = y + "px";
    }

    // 6. Click on Paper -> Slide-out Inspector Drawer
    const drawer = document.getElementById("inspectorDrawer");
    node.on("click", (event, d) => {
      if (d.type !== 'paper') return;
      event.stopPropagation();
      openInspector(d.data);
    });

    function openInspector(p) {
      document.getElementById("drawerBadge").textContent = p.queryLabel;
      document.getElementById("drawerVenue").textContent = (p.venue || "") + " · " + (p.isCore || "SSCI급");
      document.getElementById("drawerTitle").textContent = p.title;
      document.getElementById("drawerMeta").innerHTML = `
        저자: ${escapeHtml(p.authors)} ${p.firstAffiliation ? '(' + escapeHtml(p.firstAffiliation) + ')' : ''}<br>
        발행: ${escapeHtml(p.pubDate)}
      `;

      document.getElementById("drawerAiBox").innerHTML = `
        ${p.aiPurpose ? `<div class="brief-row"><span class="brief-key">[연구 목적]</span> <span class="brief-val">${escapeHtml(p.aiPurpose)}</span></div>` : ''}
        ${p.aiFindings ? `<div class="brief-row"><span class="brief-key">[주요 결과]</span> <span class="brief-val">${escapeHtml(p.aiFindings)}</span></div>` : ''}
        ${p.aiImplications ? `<div class="brief-row"><span class="brief-key">[상담 시사점]</span> <span class="brief-val">${escapeHtml(p.aiImplications)}</span></div>` : ''}
        ${(!p.aiPurpose && !p.aiFindings && !p.aiImplications) ? '<div class="brief-val">서재에 수록된 연구입니다. 아래 원문 초록을 참조해 주세요.</div>' : ''}
      `;

      document.getElementById("drawerAbstract").textContent = p.abstract || "원문 초록 미등록 (저널 원문 페이지를 참조해 주세요)";
      const doiUrl = p.doi ? (p.doi.startsWith("http") ? p.doi : "https://doi.org/" + p.doi) : "#";
      document.getElementById("drawerDoi").href = doiUrl;

      drawer.classList.add("open");
    }

    document.getElementById("drawerCloseBtn").onclick = () => {
      drawer.classList.remove("open");
    };

    svg.on("click", () => {
      drawer.classList.remove("open");
    });

    // 7. Search Input Filter
    const searchInput = document.getElementById("nodeSearch");
    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        node.style("opacity", 1);
        node.select("circle").attr("stroke", d => d.type === 'paper' ? 'rgba(255,255,255,0.4)' : '#ffffff').attr("stroke-width", d => d.type === 'paper' ? 1 : 2);
        updateLabelVisibilityOnZoom(currentZoom);
        return;
      }

      const matchIds = new Set();
      nodes.forEach(d => {
        let text = d.label;
        if (d.data) {
          text += ' ' + (d.data.authors || '') + ' ' + (d.data.venue || '') + ' ' + (d.data.keywords || '') + ' ' + (d.data.aiFindings || '');
        }
        if (text.toLowerCase().includes(q)) matchIds.add(d.id);
      });

      node.style("opacity", d => matchIds.has(d.id) ? 1 : 0.08);
      labels.style("opacity", d => matchIds.has(d.id) ? 1 : 0);
      node.select("circle")
        .attr("stroke", d => matchIds.has(d.id) ? "var(--color-highlight)" : "rgba(255,255,255,0.2)")
        .attr("stroke-width", d => matchIds.has(d.id) ? 3 : 1);
    });

    // 8. Category Filter Pills
    document.getElementById("categoryFilterBar").addEventListener("click", (e) => {
      const btn = e.target.closest(".pill-btn");
      if (!btn) return;
      document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      const filter = btn.dataset.filter;
      if (filter === 'all') {
        node.style("opacity", 1);
        link.attr("stroke-opacity", 0.5);
        updateLabelVisibilityOnZoom(currentZoom);
        return;
      }

      const activeIds = new Set();
      nodes.forEach(n => {
        if (n.type === 'category' && n.rawCat === filter) activeIds.add(n.id);
        if (n.type === 'paper' && n.data && n.data.queryLabel === filter) activeIds.add(n.id);
      });

      node.style("opacity", n => activeIds.has(n.id) ? 1 : 0.08);
      labels.style("opacity", n => activeIds.has(n.id) ? 1 : 0);
      link.attr("stroke-opacity", l => (activeIds.has(l.source.id) && activeIds.has(l.target.id)) ? 0.9 : 0.02);
    });

    // 9. Zoom Controls
    document.getElementById("btnZoomIn").onclick = () => {
      svg.transition().duration(300).call(zoom.scaleBy, 1.35);
    };

    document.getElementById("btnZoomOut").onclick = () => {
      svg.transition().duration(300).call(zoom.scaleBy, 0.7);
    };

    document.getElementById("btnFit").onclick = () => {
      svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.8));
    };

    document.getElementById("btnResetPhysics").onclick = () => {
      simulation.alpha(0.8).restart();
    };

    // 10. Dark/Light Theme Toggle
    const themeBtn = document.getElementById("themeToggleBtn");
    let isLight = localStorage.getItem("scholar_theme_map") === "light";
    if (isLight) {
      document.documentElement.setAttribute("data-theme", "light");
    }

    themeBtn.onclick = () => {
      isLight = !isLight;
      if (isLight) {
        document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("scholar_theme_map", "light");
      } else {
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("scholar_theme_map", "dark");
      }
    };

    // Window Resize
    window.addEventListener("resize", () => {
      width = window.innerWidth;
      height = window.innerHeight;
      svg.attr("viewBox", [0, 0, width, height]);
    });

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
